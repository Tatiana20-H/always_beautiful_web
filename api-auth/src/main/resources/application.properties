# ─────────────────────────────────────────────────────────────────────────────
# application.properties – Always Beautiful API de Autenticación
# GA7-220501096-AA5-EV01
# ─────────────────────────────────────────────────────────────────────────────

# ── Servidor ──────────────────────────────────────────────────────────────────
# Puerto en que escucha la API (cambiar en producción si es necesario)
server.port=8080

# ── Base de Datos MySQL ───────────────────────────────────────────────────────
# Misma base de datos usada por el proyecto PHP: AlwaysBeautifulDB
spring.datasource.url=jdbc:mysql://localhost:3306/AlwaysBeautifulDB?useSSL=false&serverTimezone=America/Bogota&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# update: crea o actualiza la tabla "usuarios" al iniciar (no borra datos existentes)
# En producción usar "validate" para no modificar el esquema automáticamente
spring.jpa.hibernate.ddl-auto=update

# Mostrar el SQL generado por Hibernate en la consola (útil para depuración)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Nombre de la aplicación ───────────────────────────────────────────────────
spring.application.name=always-beautiful-auth-api
