services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: alwaysbeautiful-web:php82
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - .:/var/www/html
    command: >-
      sh -c "mkdir -p /var/www/html/IMG/mensajes
      && chown www-data:www-data /var/www/html/IMG/mensajes
      && chmod 0775 /var/www/html/IMG/mensajes
      && exec apache2-foreground"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: alwaysbeautifuldb
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_URL: "${APP_URL:-http://localhost:8080}"
      WOMPI_PUBLIC_KEY: "${WOMPI_PUBLIC_KEY:-}"
      WOMPI_PRIVATE_KEY: "${WOMPI_PRIVATE_KEY:-}"
      WOMPI_INTEGRITY_SECRET: "${WOMPI_INTEGRITY_SECRET:-}"
      WOMPI_EVENTS_SECRET: "${WOMPI_EVENTS_SECRET:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"

  db:
    image: mariadb:11.4
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: alwaysbeautifuldb
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql
      - ./Base de datos de alwaysbeautifulweb.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./Usuarios.sql:/docker-entrypoint-initdb.d/02-users.sql:ro
      - ./Productos.sql:/docker-entrypoint-initdb.d/03-products.sql:ro

volumes:
  db_data:
