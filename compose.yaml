services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: alwaysbeautiful-web:php82
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: alwaysbeautifuldb
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-tachiandrade79@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

  db:
    image: mariadb:11.4
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: alwaysbeautifuldb
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql
      - ./Base de datos de alwaysbeautifulweb.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./Usuarios.sql:/docker-entrypoint-initdb.d/02-users.sql:ro
      - ./Productos.sql:/docker-entrypoint-initdb.d/03-products.sql:ro

volumes:
  db_data:
  vendor_data:
